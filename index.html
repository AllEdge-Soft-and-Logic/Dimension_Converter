<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <title>Dimension Converter</title>
</head>

<body>
    <div class="container">
        <h1 class="text-center bg-primary text-white p-2 rounded">
            Dimension Converter
        </h1>
        <!-- Input fields and selects in the first row -->
        <div class="row g-1 mb-3">
            <!-- Dimensions Unit -->
            <div class="col-md-4 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="originalUnitType" class="form-label">Dimensions Unit</label>
                    </div>
                    <div class="col-8">
                        <select class="form-select" id="originalUnitType">
                            <option value="cm">Centimeters (cm)</option>
                            <option value="mm">Millimeters (mm)</option>
                            <option value="m">Meters (m)</option>
                            <option value="in">Inches (in)</option>
                            <option value="ft">Feet (ft)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Length -->
            <div class="col-md-2 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="length" class="form-label">Length</label>
                    </div>
                    <div class="col-8">
                        <input type="number" class="form-control" id="length" placeholder="Length">
                    </div>
                </div>
            </div>

            <!-- Width -->
            <div class="col-md-2 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="width" class="form-label">Width</label>
                    </div>
                    <div class="col-8">
                        <input type="number" class="form-control" id="width" placeholder="Width">
                    </div>
                </div>
            </div>

            <!-- Height -->
            <div class="col-md-2 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="height" class="form-label">Height</label>
                    </div>
                    <div class="col-8">
                        <input type="number" class="form-control" id="height" placeholder="Height">
                    </div>
                </div>
            </div>

            <!-- No of Box -->
            <div class="col-md-2 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="noOfBox" class="form-label">Boxes</label>
                    </div>
                    <div class="col-8">
                        <input type="number" class="form-control" id="noOfBox" placeholder="Boxes">
                    </div>
                </div>
            </div>

            <!-- Each Box Weight -->
            <div class="col-md-4 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="weight" class="form-label">Each Box Weight</label>
                    </div>
                    <div class="col-8">
                        <input type="number" class="form-control" id="weight" placeholder="Weight">
                    </div>
                </div>
            </div>

            <!-- CFT -->
            <div class="col-md-2 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="cft" class="form-label">CFT</label>
                    </div>
                    <div class="col-8">
                        <input type="number" class="form-control" id="cft" placeholder="CFT">
                    </div>
                </div>
            </div>

            <!-- Convert Unit Type -->
            <div class="col-md-3 col-sm-6">
                <div class="row align-items-center">
                    <div class="col-4">
                        <label for="convertUnitType" class="form-label">Convert To</label>
                    </div>
                    <div class="col-8">
                        <select class="form-select" id="convertUnitType">
                            <option value="cm">Centimeters (cm)</option>
                            <option value="mm">Millimeters (mm)</option>
                            <option value="m">Meters (m)</option>
                            <option value="in">Inches (in)</option>
                            <option value="ft">Feet (ft)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons in the next row -->
        <div class="col-md-6">
            <div class="d-flex gap-2">
                <button class="btn btn-primary flex-grow-1" onclick="addData()">Add Data</button>
                <button class="btn btn-success flex-grow-1" onclick="exportToExcel()">Download Excel</button>
                <button class="btn btn-danger flex-grow-1" onclick="resetData()">Reset</button>
            </div>
        </div>
        <br>
        <h2 class="col-md-12" style="text-align: center;font-weight: bold;">Convert Data</h2>
        <div class="table-responsive">
            <table class="table table-bordered" id="combinedTable">
                <thead>
                    <tr>
                        <th>Original Length</th>
                        <th>Original Width</th>
                        <th>Original Height</th>
                        <th>No of Box</th>
                        <th>Actual Weight</th>
                        <th>Converted Length</th>
                        <th>Converted Width</th>
                        <th>Converted Height</th>
                        <th>Volumetric Weight</th>
                        <th>Chargeable Weight</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Footer inside the container -->
        <footer class="mt-4">
            <p>&copy; 2018 AllEdge Soft & Logic (OPC) Pvt. Ltd., All rights reserved. <span id="version"></span></p>
            <span class="text-muted" style="font-size: small;">Surface Mode Domestic</span>
        </footer>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Include the external JavaScript file -->
    <script src="script.js"></script>
</body>

</html>
